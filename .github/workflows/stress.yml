name: Stress

# Load and leak tests in real windows (tests/Oriel.Stress.Tests). They take
# minutes, so they run every night and on demand rather than on each push.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  stress:
    name: Stress and leak tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build tests/Oriel.Stress.Tests -c Release

      - name: Open and close 500 windows, 10 000 calls at once, events at 120 Hz for a minute
        env:
          ORIEL_STRESS: "1"
        run: >
          dotnet test tests/Oriel.Stress.Tests -c Release --no-build
          --logger "console;verbosity=detailed" --logger trx --results-directory stress-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-results
          path: stress-results
