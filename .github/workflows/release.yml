name: Release

# Pushing a tag v0.1.0-preview.1 tests, packs Oriel, Oriel.Hosting and
# Oriel.Templates at version 0.1.0-preview.1, publishes them to nuget.org
# and creates the GitHub release, with that version's section of
# CHANGELOG.md as its notes. The npm packages (packages/) go to npm at the
# same version, with the NPM_TOKEN secret.
# On pull requests that touch the release, it runs up to the packages and
# their notes, and publishes nothing.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - CHANGELOG.md
      - Directory.Build.props
      - src/*/*.csproj
      - templates/**
      - packages/**

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  release:
    name: Pack and publish
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write # Trusted Publishing: GitHub's token, traded for a nuget.org key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find the version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # A dry run takes the newest version of the changelog.
            version="$(sed -n 's/^## \([0-9][^ ]*\).*/\1/p' CHANGELOG.md | head -n 1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - name: Take the release notes from the changelog
        shell: bash
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## " { if (found) exit; found = ($2 == v); next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section '## ${{ steps.version.outputs.version }}'." >&2
            exit 1
          fi
          cat release-notes.md

      - name: Build
        run: dotnet build -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/Oriel -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts/packages
          dotnet pack src/Oriel.Hosting -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts/packages
          dotnet pack templates/Oriel.Templates -c Release -p:Version=${{ steps.version.outputs.version }} -o artifacts/packages
          dotnet pack src/Oriel.Cli -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts/packages
          dotnet pack src/plugins/Oriel.Sqlite -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts/packages
          dotnet pack src/plugins/Oriel.SecureStorage -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts/packages
          dotnet pack src/plugins/Oriel.Updates -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      # Trusted Publishing: nuget.org trusts this workflow of this repository
      # (a policy of the account named by NUGET_USER) and gives it a key
      # valid for an hour. No key is stored.
      - name: Log in to nuget.org
        if: github.ref_type == 'tag'
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        if: github.ref_type == 'tag'
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        # Bash expands the paths: on Windows, NuGet finds no file for a
        # wildcard written with slashes. Each .snupkg goes with its .nupkg.
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${{ steps.version.outputs.version }}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/packages/* \
            --title "Oriel ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md $prerelease

  npm:
    name: Publish the npm packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm's provenance: which workflow built the package
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Find the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^## \([0-9][^ ]*\).*/\1/p' CHANGELOG.md | head -n 1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Every package at the release's version, and the adapters on that oriel-runtime.
      - name: Version, build and test them
        working-directory: packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm version "$VERSION" --workspaces --no-git-tag-version
          for adapter in react vue tanstack-query; do
            npm pkg set "dependencies.oriel-runtime=$VERSION" --workspace="$adapter"
          done
          npm test
          npm pack --workspaces --dry-run

      - name: Publish to npm
        if: github.ref_type == 'tag'
        working-directory: packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag=latest
          case "${{ steps.version.outputs.version }}" in *-*) tag=next ;; esac
          npm publish --workspaces --access public --provenance --tag "$tag"
