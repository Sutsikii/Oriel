name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # For the test that compiles an installer.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build
        run: dotnet build -c Release

      - name: Test the library, the generator and the build tasks
        run: dotnet test -c Release --no-build

      - name: Test the page runtime
        run: node --test "tests/bridge/*.test.cjs"

      - name: Type-check and run the generated TypeScript
        working-directory: tests/typescript
        run: |
          npm ci
          npm test

      - name: Test in real windows
        env:
          ORIEL_E2E: "1"
        run: dotnet test tests/Oriel.EndToEnd.Tests -c Release --no-build

  linux:
    name: Test in real windows on Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install GTK, WebKitGTK and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libwebkit2gtk-4.1-0 xvfb dbus-x11

      - name: Test the library
        run: dotnet test tests/Oriel.Tests -c Release

      - name: Test in real windows
        env:
          ORIEL_E2E: "1"
        run: xvfb-run -a dbus-run-session -- dotnet test tests/Oriel.EndToEnd.Tests -c Release

  macos:
    name: Test in real windows on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test the library
        run: dotnet test tests/Oriel.Tests -c Release

      # AppKit runs on the main thread only, which dotnet test keeps: the
      # project's own Main runs the tests, and the apps' loops on it.
      - name: Test in real windows
        env:
          ORIEL_E2E: "1"
        timeout-minutes: 15
        run: dotnet run --project tests/Oriel.EndToEnd.Tests -c Release

  example:
    name: Publish the example and its installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Install the frontend's tools
        working-directory: examples/hello/frontend
        run: npm ci

      - name: Publish with NativeAOT, then build the installer
        run: dotnet publish examples/hello -c Release -r win-x64

      - name: Check the client in the repository is up to date
        run: git diff --exit-code examples/hello/frontend/src/oriel.ts

      # The chess example needs setup.ps1's downloads to run, but not to
      # check its page and test what it does without the engine.
      - name: Type-check and test the chess example's page
        working-directory: examples/chess-next-move/frontend
        run: |
          npm ci
          npm run typecheck
          npm test

      - uses: actions/upload-artifact@v4
        with:
          name: hello-installer
          path: examples/hello/bin/installer

  updates:
    name: Update an installed app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Publishes 1.0.0 and 2.0.0, packs them with vpk, installs 1.0.0 and
      # checks it updates itself to 2.0.0 (docs/updates.md).
      - name: Install, then update from 1.0.0 to 2.0.0
        shell: pwsh
        run: ./tests/updates/run.ps1

  examples:
    name: Publish the ${{ matrix.example }} example
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        example: [back-office, viewer-3d, dashboard]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the frontend's packages
        working-directory: examples/${{ matrix.example }}/frontend
        run: npm ci

      # The build type-checks the page against the client it writes, and
      # bundles it beside a native executable.
      - name: Publish with NativeAOT
        run: dotnet publish examples/${{ matrix.example }} -c Release -r win-x64 -o artifacts/${{ matrix.example }}

      - name: Check the client in the repository is up to date
        run: git diff --exit-code examples/${{ matrix.example }}/frontend/src

      - uses: actions/upload-artifact@v4
        with:
          name: example-${{ matrix.example }}
          path: artifacts/${{ matrix.example }}

  template:
    name: Create an app with dotnet new (${{ matrix.framework }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [vanilla, react, vue, svelte]
    env:
      VERSION: 0.0.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pack Oriel and the templates
        run: |
          dotnet pack src/Oriel -c Release -p:Version=${{ env.VERSION }} -o ${{ runner.temp }}/packages
          dotnet pack templates/Oriel.Templates -c Release -p:Version=${{ env.VERSION }} -o ${{ runner.temp }}/packages

      # Outside the repository, so that its build settings do not apply: the
      # app builds as it would on a user's machine, from the packages.
      - name: Create an app
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          dotnet new install "packages/Oriel.Templates.$VERSION.nupkg"
          dotnet new oriel -o Contoso.Notes --framework ${{ matrix.framework }}
          dotnet new nugetconfig -o Contoso.Notes
          dotnet nuget add source "$(cygpath -w "$RUNNER_TEMP/packages")" -n local --configfile Contoso.Notes/nuget.config
          if grep -rn OrielTemplate Contoso.Notes; then
            echo "The template's name was left in the app." >&2
            exit 1
          fi

      - name: Build it, with its frontend
        working-directory: ${{ runner.temp }}/Contoso.Notes
        run: |
          cd frontend
          npm install
          cd ..
          dotnet build -c Release
          cd frontend
          npm run build

      # NuGet takes a later version when the one asked for is missing.
      - name: Check it uses the packages just made
        shell: bash
        run: grep -q "\"oriel/$VERSION\"" "$RUNNER_TEMP/Contoso.Notes/obj/project.assets.json"

      - name: Check the template's client is up to date
        if: matrix.framework == 'vanilla'
        shell: bash
        run: |
          sed 's/Contoso\.Notes/OrielTemplate/g' "$RUNNER_TEMP/Contoso.Notes/frontend/src/oriel.ts" > "$RUNNER_TEMP/oriel.ts"
          git diff --no-index --exit-code templates/Oriel.Templates/content/oriel/frontend/src/oriel.ts "$RUNNER_TEMP/oriel.ts"

  package:
    name: Pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: |
          dotnet pack src/Oriel -c Release -o artifacts/packages
          dotnet pack src/Oriel.Hosting -c Release -o artifacts/packages
          dotnet pack templates/Oriel.Templates -c Release -o artifacts/packages
          dotnet pack src/Oriel.Cli -c Release -o artifacts/packages
          dotnet pack src/plugins/Oriel.Sqlite -c Release -o artifacts/packages
          dotnet pack src/plugins/Oriel.SecureStorage -c Release -o artifacts/packages
          dotnet pack src/plugins/Oriel.Updates -c Release -o artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
